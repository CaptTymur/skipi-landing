        }

        }

            flex: 1;
            display: flex; flex-direction: column;
            padding: 2rem 1.5rem 1rem;
            max-width: 1400px; width: 100%;
            margin: 0 auto;
        }
        .deck-head {
            display: flex; justify-content: space-between; align-items: baseline;
            margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.5rem;
        }
        .deck-title {
            font-size: clamp(1.2rem, 2.5vw, 1.65rem);
            font-weight: 800; color: var(--ink);
            letter-spacing: -0.02em;
        }
        .deck-counter {
            font-size: 0.92rem; color: var(--muted);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .deck-counter strong { color: var(--ink); font-weight: 700; }

        .slide {
            display: grid;
            grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
            gap: 2rem;
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.75rem;
            flex: 1;
            min-height: 0;
            animation: fade 0.25s ease-out;
        }
        @keyframes fade {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: none; }
        }

        .slide-figure {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.9rem;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .slide-figure img {
            max-width: 100%; max-height: 64vh;
            width: auto; height: auto;
            object-fit: contain;
            display: block;
        }

            margin-bottom: 0.25rem;

            margin-bottom: 1rem;

            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.7rem;
            flex: 1; min-height: 0;

            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.8rem 0.9rem;
            display: flex; flex-direction: column;

        .ctrl-btn:hover:not(:disabled) {

        .ctrl-btn:disabled {

        .ctrl-btn.primary {
            background: var(--ink); color: #fff; border-color: var(--ink);
        }
        .ctrl-btn.primary:hover:not(:disabled) {

            width: 0.55rem; height: 0.55rem; border-radius: 50%;
            background: var(--border);
            cursor: pointer; transition: all 0.15s;

            nav.controls { flex-wrap: wrap; justify-content: center; }

            background: #061a2c; color: rgba(255,255,255,0.65);
            padding: 1.25rem 1.5rem;
            font-size: 0.84rem; text-align: center;
        }
        footer.site a { color: rgba(255,255,255,0.85); }
        footer.site a:hover { color: #fff; }
    </style>
</head>

    let idx = 0;

    function parseHash() {
        const m = (location.hash || '').match(/^#(\d+)/);
        if (m) {
            const n = parseInt(m[1], 10) - 1;
            if (n >= 0 && n < SLIDES.length) return n;
        }
        return 0;
    }

    function writeHash(n) {
        const h = '#' + (n + 1);
        if (location.hash !== h) history.replaceState(null, '', h);
    }

    function render() {
        const s = SLIDES[idx];

        // Reset animation
        slideEl.style.animation = 'none';
        // force reflow

        slideEl.style.animation = '';

        // Figure: either hand-drawn image, or synthetic consumers grid

                '<div class="consumers-source">Один слой данных от экипажей <span>→ много decision-makers</span></div>' +
                '<div class="consumers-grid">' +
                s.consumers.map(c =>
                    '<div class="consumer-card">' +
                        '<div class="ico">' + c.ico + '</div>' +
                        '<h4>' + c.name + '</h4>' +
                        '<p>' + c.desc + '</p>' +
                    '</div>'
                ).join('') +
                '</div>';
        } else {
            figEl.removeAttribute('data-type');
            figEl.innerHTML = '<img id="slide-img" src="img/slide-' + (idx + 1) + '.jpg" alt="' + s.title.replace(/"/g, '&quot;') + '" loading="eager">';
        }

        kickerEl.textContent = s.kicker;
        titleEl.textContent = s.title;
        leadEl.textContent = s.lead;
        pointsEl.innerHTML = (s.points || []).map(p => '<li>' + p + '</li>').join('');
        pointsEl.style.display = (s.points && s.points.length) ? '' : 'none';
        footEl.innerHTML = '<strong>Замечание капитана:</strong> ' + s.foot;
        nowEl.textContent = idx + 1;

        prevBtn.disabled = idx === 0;

        // On the last slide, the "next" button turns into a download CTA.
        if (idx === SLIDES.length - 1) {
            nextBtn.disabled = false;
            nextBtn.dataset.mode = 'download';
            nextBtn.innerHTML = '<span class="label">Скачать Skipi</span> →';
            nextBtn.setAttribute('aria-label', 'Скачать Skipi');
        } else {
            nextBtn.disabled = false;
            nextBtn.dataset.mode = 'next';
            nextBtn.innerHTML = '<span class="label">Дальше</span> →';
            nextBtn.setAttribute('aria-label', 'Следующий слайд');
        }

        document.querySelectorAll('.dot').forEach((d, i) => {
            d.classList.toggle('active', i === idx);
            d.setAttribute('aria-selected', i === idx ? 'true' : 'false');
        });
    }

    function go(n) {
        if (n < 0) n = 0;
        if (n >= SLIDES.length) n = SLIDES.length - 1;
        if (n === idx) return;
        idx = n;
        writeHash(idx);
        render();
    }

    // Init dots
    totalEl.textContent = SLIDES.length;
    SLIDES.forEach((_, i) => {
        const d = document.createElement('button');
        d.className = 'dot';
        d.type = 'button';
        d.setAttribute('role', 'tab');
        d.setAttribute('aria-label', 'Слайд ' + (i + 1));
        d.addEventListener('click', () => go(i));
        dotsEl.appendChild(d);
    });

    prevBtn.addEventListener('click', () => go(idx - 1));
    nextBtn.addEventListener('click', () => {
        if (nextBtn.dataset.mode === 'download') {
            window.location.href = '/downloads';
        } else {
            go(idx + 1);
        }
    });

    // Keyboard
    document.addEventListener('keydown', e => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
            e.preventDefault(); go(idx + 1);
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
            e.preventDefault(); go(idx - 1);
        } else if (e.key === 'Home') {
            e.preventDefault(); go(0);
        } else if (e.key === 'End') {
            e.preventDefault(); go(SLIDES.length - 1);
        }
    });

    // Hash routing
    window.addEventListener('hashchange', () => {
        idx = parseHash();
        render();
    });

    // Swipe (mobile)
    let touchX = null;
    document.addEventListener('touchstart', e => {
        if (e.touches.length === 1) touchX = e.touches[0].clientX;
    }, { passive: true });
    document.addEventListener('touchend', e => {
        if (touchX === null) return;
        const dx = (e.changedTouches[0].clientX) - touchX;
        if (Math.abs(dx) > 60) {
            if (dx < 0) go(idx + 1);
            else go(idx - 1);
        }
        touchX = null;
    }, { passive: true });

    // Initial render
    idx = parseHash();
    render();
})();
</script>

</body>
</html>
