    };

    const productStep = document.getElementById("product-step");
    const productGrid = document.getElementById("product-grid");
    const channelStep = document.getElementById("channel-step");
    const platformStep = document.getElementById("platform-step");
    const platformGrid = document.getElementById("platform-grid");
    const resultStep = document.getElementById("result-step");
    const crumbs = document.getElementById("crumbs");
    const title = document.getElementById("page-title");
    const lead = document.getElementById("page-lead");
    const eyebrow = document.getElementById("eyebrow");

    const state = { product: null, channel: null, platform: null };

    function escapeHtml(value) {
        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function setHash() {
        const parts = [state.product, state.channel, state.platform].filter(Boolean);
        const next = parts.length ? `#${parts.join("/")}` : location.pathname;
        history.pushState(null, "", next);
    }

    function parseHash() {
        const parts = location.hash.replace(/^#/, "").split("/").filter(Boolean);
        state.product = products[parts[0]] ? parts[0] : null;
        state.channel = ["desktop", "mobile"].includes(parts[1]) ? parts[1] : null;
        state.platform = ["windows", "macos", "linux", "android", "ios"].includes(parts[2]) ? parts[2] : null;
        if (!state.product) {
            state.channel = null;
            state.platform = null;
        }
        if (!state.channel) state.platform = null;
    }

    function hideAllSteps() {
        productStep.classList.add("hidden");
        channelStep.classList.add("hidden");
        platformStep.classList.add("hidden");
        resultStep.classList.add("hidden");
    }

    function renderProducts() {
        productGrid.innerHTML = Object.entries(products).map(([key, product]) => `
            <button class="choice-card" type="button" data-action="select-product" data-product="${key}">
                <div class="topline">
                    <img src="${product.icon}" width="68" height="68" alt="">
                    <span class="meta">Выбрать →</span>
                </div>
                <div>
                    <h2>${escapeHtml(product.label)}</h2>
                    <p>${escapeHtml(product.title)}</p>
                </div>
                <p>${escapeHtml(product.description)}</p>
            </button>
        `).join("");
    }

    function renderPlatforms() {
        const platforms = state.channel === "desktop"
            ? ["windows", "macos", "linux"]
            : ["android", "ios"];

        platformGrid.innerHTML = platforms.map((key) => {
            const [label, symbol, description] = platformLabels[key];
            return `
                <button class="choice-card compact" type="button" data-action="select-platform" data-platform="${key}">
                    <span class="symbol">${symbol}</span>
                    <div>
                        <h2>${label}</h2>
                        <p>${description}</p>
                    </div>
                    <span class="meta">Продолжить →</span>
                </button>
            `;
        }).join("");
    }

    function requestSubject(product, platform) {
        return platform === "android"
            ? `Android testing request - ${product.title}`
            : `iOS TestFlight request - ${product.title}`;
    }

    function requestText(product, platform, values = {}) {
        const accountLabel = platform === "android" ? "Google Play email" : "Apple ID email";
        const platformText = platform === "android" ? "Android testing" : "TestFlight";
        return [
            `Hello,`,
            ``,
            `I want to join ${platformText} for ${product.title}.`,
            ``,
            `${accountLabel}: ${values.email || ""}`,
            `Device: ${values.device || ""}`,
            `Company (optional): ${values.company || ""}`,
            `Country: ${values.country || ""}`,
            values.message ? `Message: ${values.message}` : "",
            ``,
            `Thank you.`
        ].filter((line, index, lines) => line || lines[index - 1] !== "").join("\n");
    }

    function gmailUrl(product, platform, values = {}) {
        const to = encodeURIComponent(product.requestEmail || product.email);
        const subject = encodeURIComponent(requestSubject(product, platform));
        const body = encodeURIComponent(requestText(product, platform, values));
        return `https://mail.google.com/mail/?view=cm&fs=1&to=${to}&su=${subject}&body=${body}`;
    }

    function requestForm(product, platform) {
        const accountLabel = platform === "android" ? "Google Play email" : "Apple ID email";
        const buttonLabel = platform === "android" ? "Отправить Android-запрос" : "Отправить TestFlight-запрос";
        const template = requestText(product, platform);
        return `
            <form class="request-form" data-request-form data-product="${state.product}" data-platform="${platform}">
                <div class="form-grid">
                    <label class="form-field">
                        ${accountLabel} *
                        <input name="email" type="email" required autocomplete="email" placeholder="${platform === "android" ? "name@gmail.com" : "appleid@example.com"}">
                    </label>
                    <label class="form-field">
                        Устройство
                        <input name="device" type="text" autocomplete="off" placeholder="${platform === "android" ? "Samsung, Xiaomi, Pixel..." : "iPhone / iPad model"}">
                    </label>
                    <label class="form-field">
                        Компания
                        <input name="company" type="text" autocomplete="organization" placeholder="Optional">
                    </label>
                    <label class="form-field">
                        Страна
                        <input name="country" type="text" autocomplete="country-name" placeholder="Country">
                    </label>
                    <label class="form-field full">
                        Комментарий
                        <textarea name="message" placeholder="Если есть проблема или особый вопрос, напишите здесь."></textarea>
                    </label>
                </div>
                <label class="hp-field">
                    Website
                    <input name="website" type="text" tabindex="-1" autocomplete="off">
                </label>
                <div class="actions">
                    <button class="btn primary" type="submit">${buttonLabel}</button>
                    <button class="btn" type="button" data-action="open-gmail" data-platform="${platform}">Открыть Gmail</button>
                    <button class="btn" type="button" data-action="copy-request" data-platform="${platform}">Скопировать письмо</button>
                </div>
                <p class="form-status" data-form-status></p>
                <div class="fallback-box">
                    Если форма не отправилась, напишите на <strong>${escapeHtml(product.requestEmail || product.email)}</strong> и вставьте этот текст:
                    <div class="copy-template">${escapeHtml(template)}</div>
                </div>
            </form>
        `;
    }

    function renderDesktopResult(product) {
        const item = product.desktop[state.platform];
        const buttons = item.links.map(([label, href, primary]) => {
            const className = primary ? "btn primary" : "btn";
            return `<a class="${className}" href="${href}">${escapeHtml(label)}</a>`;
        }).join("");
        const note = item.note ? `<p class="support-note">${item.note}</p>` : "";
        return `
            <div class="download-card">
                <h3>${escapeHtml(item.title)} · ${escapeHtml(item.version)}</h3>
                <p>${escapeHtml(item.text)}</p>
                <div class="actions">${buttons}</div>
                ${note}
            </div>
        `;
    }

    function renderMobileResult(product) {
        if (state.platform === "android") {
            return `
                <div class="download-card green">
                    <h3>Android через Google Play testing</h3>
                    <p>Мобильная версия распространяется через закрытое тестирование Google Play. Это нормальный путь до публичного релиза: мы добавим ваш Google email в список тестировщиков и пришлем ссылку установки.</p>
                    <ol>
                        <li>Заполните форму ниже и отправьте Google email, который используется на телефоне в Google Play.</li>
                        <li>На телефоне войдите в Google Play именно под этим аккаунтом.</li>
                        <li>После нашего подтверждения откройте ссылку тестирования и нажмите Join testing / Install.</li>
                        <li>Если видите «App not available», ответьте на письмо и приложите скриншот.</li>
                    </ol>
                    ${requestForm(product, "android")}
                </div>
            `;
        }

        return `
            <div class="download-card purple">
                <h3>iPhone / iPad через TestFlight</h3>
                <p>iOS/iPadOS-версия распространяется через Apple TestFlight. Оставьте Apple ID и устройство: мы добавим вас в тестовую программу и пришлем приглашение, когда сборка будет доступна для выбранного продукта.</p>
                <ol>
                    <li>Укажите Apple ID email, которым пользуетесь в App Store / TestFlight.</li>
                    <li>Установите приложение TestFlight из App Store, если его ещё нет.</li>
                    <li>После приглашения откройте ссылку от Apple и нажмите Accept / Install.</li>
                    <li>Если приглашение не пришло, ответьте на письмо и укажите модель iPhone/iPad.</li>
                </ol>
                ${requestForm(product, "ios")}
            </div>
        `;
    }

    function renderResult() {
        const product = products[state.product];
        const platform = platformLabels[state.platform][0];
        const body = state.channel === "desktop"
            ? renderDesktopResult(product)
            : renderMobileResult(product);

        resultStep.innerHTML = `
            <div class="result-panel">
                <div class="result-head">
                    <img src="${product.icon}" width="58" height="58" alt="">
                    <div>
                        <h2>${escapeHtml(product.title)} · ${escapeHtml(platform)}</h2>
                        <p>${escapeHtml(product.description)}</p>
                    </div>
                </div>
                <div class="result-body">
                    ${body}
                    <div class="download-card amber">
                        <h3>Нужна помощь?</h3>
                        <p>Если ссылка не открывается, установка блокируется или вы не уверены, какую сборку выбрать, напишите нам.</p>
                        <div class="actions">
                            <a class="btn" href="mailto:${product.requestEmail || product.email}">${product.requestEmail || product.email}</a>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    function renderCrumbs() {
        const product = state.product ? products[state.product] : null;
        const parts = [];
        if (state.product) {
            parts.push('<button type="button" data-action="go-products">Продукты</button>');
            parts.push(`<span>${escapeHtml(product.label)}</span>`);
        }
        if (state.channel) {
            parts.push('<button type="button" data-action="go-channel">Тип</button>');
            parts.push(`<span>${state.channel === "desktop" ? "Desktop" : "Mobile"}</span>`);
        }
        if (state.platform) {
            parts.push('<button type="button" data-action="go-platform">Платформа</button>');
            parts.push(`<span>${platformLabels[state.platform][0]}</span>`);
        }
        crumbs.innerHTML = parts.join("");
        crumbs.classList.toggle("hidden", parts.length === 0);
    }

    function renderCopy() {
        const product = state.product ? products[state.product] : null;
        eyebrow.textContent = "Download center";
        if (!state.product) {
            title.textContent = "Что вы хотите скачать?";
            lead.textContent = "Skipi - United Seafarers. Desktop-версии можно скачать сразу. Для mobile выберите продукт и оставьте заявку в программу тестирования Android или iPhone.";
            return;
        }
        if (!state.channel) {
            title.textContent = product.label;
            lead.textContent = `${product.title}. Desktop можно скачать сразу; mobile подключается через программу тестирования.`;
            return;
        }
        if (!state.platform) {
            title.textContent = state.channel === "desktop" ? `${product.label}: desktop` : `${product.label}: mobile`;
            lead.textContent = state.channel === "desktop"
                ? "Выберите операционную систему компьютера."
                : "Выберите мобильную платформу. На следующем шаге будет форма заявки в Google Play testing или Apple TestFlight.";
            return;
        }
        title.textContent = `${product.title}: ${platformLabels[state.platform][0]}`;
        lead.textContent = state.channel === "desktop"
            ? "Скачайте подходящий установщик."
            : "Следуйте инструкции для получения мобильной версии.";
    }

    function render() {
        hideAllSteps();
        renderCopy();
        renderCrumbs();
        if (!state.product) {
            productStep.classList.remove("hidden");
            return;
        }
        if (!state.channel) {
            channelStep.classList.remove("hidden");
            return;
        }
        if (!state.platform) {
            renderPlatforms();
            platformStep.classList.remove("hidden");
            return;
        }
        renderResult();
        resultStep.classList.remove("hidden");
    }

    document.addEventListener("click", (event) => {
        const target = event.target.closest("[data-action]");
        if (!target) return;
        const action = target.dataset.action;
        if (action === "open-gmail") {
            const product = products[state.product];
            const form = target.closest("[data-request-form]");
            const values = form ? Object.fromEntries(new FormData(form).entries()) : {};
            window.open(gmailUrl(product, target.dataset.platform, values), "_blank", "noopener");
            return;
        }
        if (action === "copy-request") {
            const product = products[state.product];
            const form = target.closest("[data-request-form]");
            const values = form ? Object.fromEntries(new FormData(form).entries()) : {};
            navigator.clipboard.writeText(requestText(product, target.dataset.platform, values)).then(() => {
                const status = form ? form.querySelector("[data-form-status]") : null;
                if (status) {
                    status.textContent = "Текст заявки скопирован.";
                    status.className = "form-status ok";
                }
            }).catch(() => {
                const status = form ? form.querySelector("[data-form-status]") : null;
                if (status) {
                    status.textContent = "Не удалось скопировать автоматически. Выделите текст ниже вручную.";
                    status.className = "form-status error";
                }
            });
            return;
        }
        if (action === "select-product") {
            state.product = target.dataset.product;
            state.channel = null;
            state.platform = null;
        }
        if (action === "select-channel") {
            state.channel = target.dataset.channel;
            state.platform = null;
        }
        if (action === "select-platform") {
            state.platform = target.dataset.platform;
        }
        if (action === "go-products") {
            state.product = null;
            state.channel = null;
            state.platform = null;
        }
        if (action === "go-channel") {
            state.channel = null;
            state.platform = null;
        }
        if (action === "go-platform") {
            state.platform = null;
        }
        setHash();
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
    });

    document.addEventListener("submit", async (event) => {
        const form = event.target.closest("[data-request-form]");
        if (!form) return;
        event.preventDefault();
        const productKey = form.dataset.product;
        const platform = form.dataset.platform;
        const product = products[productKey];
        const status = form.querySelector("[data-form-status]");
        const submitButton = form.querySelector("button[type='submit']");
        const values = Object.fromEntries(new FormData(form).entries());
        const payload = {
            product: productKey,
            platform,
            email: String(values.email || "").trim(),
            device: String(values.device || "").trim(),
            company: String(values.company || "").trim(),
            country: String(values.country || "").trim(),
            message: String(values.message || "").trim(),
            website: String(values.website || "").trim(),
            source_url: location.href
        };
        if (!payload.email) {
            status.textContent = "Укажите email для Google Play или TestFlight.";
            status.className = "form-status error";
            return;
        }
        status.textContent = "Отправляем запрос...";
        status.className = "form-status";
        submitButton.disabled = true;
        try {
            const response = await fetch("https://api.skipi.app/api/tester-requests", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            status.textContent = `Запрос принят. Номер: ${data.id}`;
            status.className = "form-status ok";
            form.reset();
        } catch (error) {
            status.innerHTML = `Автоматическая отправка сейчас не прошла. Откройте Gmail или скопируйте письмо ниже и отправьте на <strong>${escapeHtml(product.requestEmail || product.email)}</strong>.`;
            status.className = "form-status error";
        } finally {
            submitButton.disabled = false;
        }
    });

    window.addEventListener("popstate", () => {
        parseHash();
        render();
    });

    renderProducts();
    parseHash();
    render();
</script>

</body>
</html>
