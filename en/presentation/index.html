<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>How Skipi works — Captain's deck in 6 steps</title>
    <meta name="description" content="Skipi explained in 6 hand-drawn steps by Captain Tymur: anonymized job signature, apply without disclosure, E2E chat, what crewing and seafarer get, outreach minimum, and the wider Intelligence consumers.">
    <link rel="canonical" href="https://skipi.app/en/presentation/">
    <link rel="alternate" hreflang="en" href="https://skipi.app/en/presentation/">
    <link rel="alternate" hreflang="ru" href="https://skipi.app/presentation/">
    <meta property="og:title" content="How Skipi works — Captain's deck in 6 steps">
    <meta property="og:description" content="Captain Tymur explains the Skipi architecture: anonymized matching, E2E apply, decision support for the seafarer, and the wider intelligence consumers.">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://skipi.app/en/presentation/">
    <meta property="og:image" content="https://skipi.app/presentation/img/slide-1.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --ink:       #0a1f33;
            --ink-soft:  #2a3f55;
            --body:      #475569;
            --muted:     #7f8da0;
            --accent:    #007a86;
            --accent-dk: #005e68;
            --bg:        #ffffff;
            --bg-soft:   #f6f8fa;
            --bg-deep:   #edf1f5;
            --border:    #e3e8ee;
        }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--body);
            background: var(--bg);
            line-height: 1.55;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            display: flex; flex-direction: column;
            min-height: 100vh;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { color: var(--accent-dk); }

        /* ── Header ───────────────────────────────────────────── */
        header.site {
            background: rgba(255,255,255,0.94);
            backdrop-filter: saturate(160%) blur(8px);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 50;
        }
        .nav {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.85rem 1.5rem;
            max-width: 1400px; margin: 0 auto;
        }
        .brand {
            font-weight: 800; font-size: 1.2rem; color: var(--ink);
            letter-spacing: -0.01em;
        }
        .brand .dot { color: var(--accent); }
        .nav-meta {
            display: flex; align-items: center; gap: 1.5rem;
            font-size: 0.88rem; color: var(--muted);
        }
        .nav-meta a { color: var(--ink-soft); font-weight: 500; }
        .nav-meta a:hover { color: var(--accent); }
        @media (max-width: 640px) {
            .nav-meta { gap: 1rem; font-size: 0.8rem; }
            .nav-meta .author { display: none; }
        }

        /* ── Slide area ───────────────────────────────────────── */
        main.deck {
            flex: 1;
            display: flex; flex-direction: column;
            padding: 2rem 1.5rem 1rem;
            max-width: 1400px; width: 100%;
            margin: 0 auto;
        }
        .deck-head {
            display: flex; justify-content: space-between; align-items: baseline;
            margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.5rem;
        }
        .deck-title {
            font-size: clamp(1.2rem, 2.5vw, 1.65rem);
            font-weight: 800; color: var(--ink);
            letter-spacing: -0.02em;
        }
        .deck-counter {
            font-size: 0.92rem; color: var(--muted);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .deck-counter strong { color: var(--ink); font-weight: 700; }

        .slide {
            display: grid;
            grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
            gap: 2rem;
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.75rem;
            flex: 1;
            min-height: 0;
            animation: fade 0.25s ease-out;
        }
        @keyframes fade {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: none; }
        }

        .slide-figure {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.9rem;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .slide-figure img {
            max-width: 100%; max-height: 64vh;
            width: auto; height: auto;
            object-fit: contain;
            display: block;
        }

        /* Synthetic figure: consumer cards grid (slide 5) */
        .slide-figure[data-type="consumers"] {
            padding: 1.5rem 1.25rem;
            background: linear-gradient(155deg, #f6f8fa 0%, #e6eef4 100%);
            align-items: stretch; justify-content: flex-start;
            flex-direction: column;
        }
        .slide-figure[data-type="consumers"] img { display: none; }
        .consumers-title {
            font-size: 0.74rem; letter-spacing: 0.12em; text-transform: uppercase;
            color: var(--accent); font-weight: 700;
            margin-bottom: 0.25rem;
        }
        .consumers-source {
            font-size: 0.82rem; color: var(--ink); font-weight: 700;
            margin-bottom: 1rem;
        }
        .consumers-source span { color: var(--muted); font-weight: 500; }
        .consumers-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.7rem;
            flex: 1; min-height: 0;
        }
        .consumer-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.8rem 0.9rem;
            display: flex; flex-direction: column;
            gap: 0.3rem;
        }
        .consumer-card .ico { font-size: 1.25rem; line-height: 1; }
        .consumer-card h4 {
            font-size: 0.9rem; font-weight: 700; color: var(--ink);
            letter-spacing: -0.01em; line-height: 1.2;
        }
        .consumer-card p {
            font-size: 0.78rem; color: var(--ink-soft);
            line-height: 1.45;
        }
        @media (max-width: 880px) {
            .consumers-grid { grid-template-columns: 1fr; }
        }

        .slide-body {
            display: flex; flex-direction: column;
            padding-top: 0.25rem;
        }
        .slide-kicker {
            display: inline-block;
            color: var(--accent); font-weight: 700;
            font-size: 0.74rem; letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 0.7rem;
        }
        .slide-title {
            font-size: clamp(1.3rem, 2.2vw, 1.7rem);
            font-weight: 800; color: var(--ink);
            letter-spacing: -0.02em; line-height: 1.18;
            margin-bottom: 0.9rem;
        }
        .slide-lead {
            font-size: 1.02rem; color: var(--ink-soft);
            margin-bottom: 1.2rem;
        }
        .slide-points {
            list-style: none;
            display: grid; gap: 0.65rem;
            margin-bottom: 1.2rem;
        }
        .slide-points li {
            padding-left: 1.4rem; position: relative;
            color: var(--ink-soft); font-size: 0.95rem;
        }
        .slide-points li::before {
            content: "→"; position: absolute; left: 0; top: 0;
            color: var(--accent); font-weight: 700;
        }
        .slide-foot {
            margin-top: auto;
            font-size: 0.82rem; color: var(--muted);
            border-top: 1px solid var(--border);
            padding-top: 0.85rem;
        }
        .slide-foot strong { color: var(--ink-soft); }

        @media (max-width: 880px) {
            .slide {
                grid-template-columns: 1fr;
                gap: 1.25rem;
                padding: 1.25rem;
            }
            .slide-figure img { max-height: 45vh; }
        }

        /* ── Controls ─────────────────────────────────────────── */
        nav.controls {
            display: flex; align-items: center; justify-content: space-between;
            gap: 1rem;
            padding: 1.25rem 1.5rem 2rem;
            max-width: 1400px; width: 100%;
            margin: 0 auto;
        }
        .ctrl-btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.7rem 1.25rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #fff; color: var(--ink);
            font-weight: 600; font-size: 0.92rem;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .ctrl-btn:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-1px);
        }
        .ctrl-btn:disabled {
            opacity: 0.35; cursor: not-allowed;
        }
        .ctrl-btn.primary {
            background: var(--ink); color: #fff; border-color: var(--ink);
        }
        .ctrl-btn.primary:hover:not(:disabled) {
            background: var(--accent); border-color: var(--accent); color: #fff;
        }

        .dots {
            display: flex; gap: 0.5rem;
        }
        .dot {
            width: 0.55rem; height: 0.55rem; border-radius: 50%;
            background: var(--border);
            cursor: pointer; transition: all 0.15s;
            border: none; padding: 0;
        }
        .dot:hover { background: var(--muted); }
        .dot.active {
            background: var(--accent); transform: scale(1.3);
        }
        @media (max-width: 560px) {
            nav.controls { flex-wrap: wrap; justify-content: center; }
            .ctrl-btn { padding: 0.55rem 0.9rem; font-size: 0.86rem; }
            .ctrl-btn .label { display: none; }
        }

        /* ── Footer ───────────────────────────────────────────── */
        footer.site {
            background: #061a2c; color: rgba(255,255,255,0.65);
            padding: 1.25rem 1.5rem;
            font-size: 0.84rem; text-align: center;
        }
        footer.site a { color: rgba(255,255,255,0.85); }
        footer.site a:hover { color: #fff; }
    </style>
</head>
<body>

<header class="site">
    <div class="nav">
        <a href="/en/" class="brand">Skipi<span class="dot">.</span></a>
        <div class="nav-meta">
            <span class="author">Captain Tymur · 11 June 2026</span>
            <a href="/en/">← Back to site</a>
            <a href="/downloads">Download</a>
        </div>
    </div>
</header>

<main class="deck">
    <div class="deck-head">
        <div class="deck-title">How Skipi works — in 6 steps</div>
        <div class="deck-counter"><strong id="slide-now">1</strong> / <span id="slide-total">6</span></div>
    </div>

    <article class="slide" id="slide" aria-live="polite">
        <div class="slide-figure" id="slide-figure">
            <img id="slide-img" src="/presentation/img/slide-1.jpg" alt="" loading="eager">
        </div>
        <div class="slide-body">
            <span class="slide-kicker" id="slide-kicker"></span>
            <h1 class="slide-title" id="slide-title"></h1>
            <p class="slide-lead" id="slide-lead"></p>
            <ul class="slide-points" id="slide-points"></ul>
            <div class="slide-foot" id="slide-foot"></div>
        </div>
    </article>
</main>

<nav class="controls" aria-label="Slide navigation">
    <button class="ctrl-btn" id="prev" type="button">← <span class="label">Back</span></button>
    <div class="dots" id="dots" role="tablist"></div>
    <button class="ctrl-btn primary" id="next" type="button"><span class="label">Next</span> →</button>
</nav>

<footer class="site">
    © 2026 Skipi &nbsp;·&nbsp;
    <a href="/en/">skipi.app</a> &nbsp;·&nbsp;
    <a href="mailto:info@tymur.org">info@tymur.org</a>
</footer>

<script>
(function () {
    'use strict';

    const SLIDES = [
        {
            kicker: 'Step 1 · Profile and request signature',
            title: "Seafarer's profile — local. Crewing's request — by signature. Match — on the seafarer's side.",
            lead: "The seafarer uploads documents and sea experience into Skipi — the structured profile is built locally, the files stay on the device. The crewing creates a request for a seafarer with a specific profile and pushes only the request signature to the server: vessel type, position, nationality. The seafarer's app checks the database — are there requests under their profile? No personal data leaves the device.",
            points: [
                'Seafarer uploads documents and experience → structured profile is built locally, files stay on the device',
                'Crewing creates a request for a seafarer with a specific profile (vessel type · position · nationality)',
                "Seafarer's app checks the database: any requests matching my profile?",
                'No personal data is transferred — only the profile signature lives on the server'
            ],
            foot: 'All files — on both the seafarer and the crewing side — stay on the device. The server holds the request signature, not the data.'
        },
        {
            kicker: 'Step 2 · Apply and E2E chat',
            title: 'Match → notification → apply in one click. Then — E2E chat and structured documents.',
            lead: 'When work matching the seafarer\u2019s profile is found, they get a notification. They can review the offer and apply in one click. The crewing receives the application without disclosure of personal data. From there, an end-to-end encrypted chat opens: the crewing requests documents, the seafarer sends them in one click. Documents arrive in a strictly structured form.',
            points: [
                'Match found → the seafarer gets a notification with the offer terms',
                "Apply — one button. The crewing receives the application without the seafarer's personal data",
                'An end-to-end encrypted chat opens between the devices',
                'In the chat the crewing requests documents, the seafarer sends them — all in one click',
                'Documents arrive in a strictly structured form, not as a pile of PDFs in an email'
            ],
            foot: 'The server is a rendezvous point for the chat, not a data vault. Documents and messages flow directly between devices, in a structured protocol.'
        },
        {
            kicker: 'Step 3 · For Crewing',
            title: 'What Skipi gives a crewing manager',
            lead: 'Skipi is an operational tool for the crewing, not "yet another job board". A structured candidate profile, a unified data-exchange protocol, compliance check per specific client, and a local database of considered candidates and ex-crew.',
            points: [
                'Solid documents profile structure — one canonical structure for the candidate profile',
                'Unified protocol of data exchange — one protocol instead of "PDFs in email"',
                'Easy profile compliance check for a particular client — compliance fit per specific ship manager',
                'Maintaining a database of considered candidates and ex-crew — a living DB owned by the crewing'
            ],
            foot: "No vendor lock-in: the crewing's database lives in files on its device, exportable at any moment."
        },
        {
            kicker: 'Step 4 · For Seafarer + Skipi Intelligence',
            title: 'The seafarer gets a marketplace and intelligence at the same time',
            lead: "On top of the matching loop sits Skipi Intelligence — a database of vessels and companies fed by seafarers' own assessments of ex-vessels. From it come the indices that support decisions.",
            points: [
                'Channel of outreach to find a job — outgoing channel for finding work',
                'Channel of incoming matching offers — inbound offers under the profile signature',
                'Decision support via indices: Position Salary Index · Position Demand Score · Company Retention Index · Profile Track Promotion Score',
                'Easy document management: upload · send docs · receive job offers',
                'Skipi Intelligence is built from ex-vessel assessments by the seafarers themselves — crews feed the database'
            ],
            foot: "The seafarer's data is not disclosed until they hit 'send'. Send or not — the seafarer decides, supported by Skipi Intelligence."
        },
        {
            kicker: 'Step 5 · Outreach minimum',
            title: 'Even without industry-wide adoption, Skipi becomes an outreach tool',
            lead: "Until the whole industry is on Skipi — the seafarer doesn't lose the market. The minimum outreach functionality assembles the CV and document package once and dispatches them in a single action to three types of recipients. The same artifacts can be exported locally — a ZIP archive of documents and a CV as PDF — and sent through any channel by hand.",
            points: [
                'Your custom email list — addresses the seafarer entered manually (their own outreach address book)',
                'Crewing-office requests for your profile — crewings that installed Skipi Crewing and subscribed in the outreach module to seafarers with this profile signature',
                'Email list suggested by Skipi — curated contacts by rank, vessel type, geography',
                'ZIP archive of all documents and CV as PDF — export locally and send through any channel by hand'
            ],
            foot: 'Outreach minimum closes the gap between the Skipi universe and the regular email world. Install Skipi — and the CV with the document package is always ready, in any direction.'
        },
        {
            kicker: 'Step 6 · Intelligence consumers',
            title: 'These same signals are needed by the entire decision chain around a vessel',
            lead: 'Vessel score, vetting pressure, management response, company retention — the same indices are bought by ship-finance banks, investors, freight brokers, charterers, P&I clubs and ship managers. Anyone who commits money or makes a commercial decision on a specific vessel or company needs an operational signal from the inside.',
            figureType: 'consumers',
            consumers: [
                {
                    ico: '⚖',
                    name: 'Freight brokers and charterers',
                    desc: 'Pre-fixture vetting: the real state of the vessel, not only a clean SIRE. Not taking your client onto a problem vessel is what makes a good broker. Vessel assessment in chartering — the core fixture decision.'
                },
                {
                    ico: '🏦',
                    name: 'Banks (ship finance)',
                    desc: 'Collateral monitoring before drawdown and across the life of the loan. Skipi-score complements classification society reports with a real operational signal from the crew.'
                },
                {
                    ico: '💼',
                    name: 'Investors and S&P',
                    desc: 'Due diligence before buying a vessel or fleet. Management track record, crew retention rate, hidden operational issues not visible from broker pitch-decks.'
                },
                {
                    ico: '🛡',
                    name: 'P&I clubs and insurers',
                    desc: 'Risk pricing and underwriting. Vessel score becomes part of the cargo / H&M / P&I model — especially for tonnage without a long claim history.'
                },
                {
                    ico: '⚙',
                    name: 'Third-party ship managers',
                    desc: "Benchmark your own fleet against the market, assess counterparties and competitors. Your crewing partner's behaviour on retention is objectively visible."
                },
                {
                    ico: '📦',
                    name: 'Cargo owners and cargo interests',
                    desc: 'Direct check on the vessel and owner before a transportation contract. Especially relevant for high-value cargo where vessel reputation matters more than the rate.'
                }
            ],
            foot: 'Skipi Intelligence — one data layer from the crew, serving the entire decision chain around a vessel. The seafarer is the signal source. All others are consumers.'
        }
    ];

    const totalEl  = document.getElementById('slide-total');
    const nowEl    = document.getElementById('slide-now');
    const figEl    = document.getElementById('slide-figure');
    const imgEl    = document.getElementById('slide-img');
    const kickerEl = document.getElementById('slide-kicker');
    const titleEl  = document.getElementById('slide-title');
    const leadEl   = document.getElementById('slide-lead');
    const pointsEl = document.getElementById('slide-points');
    const footEl   = document.getElementById('slide-foot');
    const slideEl  = document.getElementById('slide');
    const prevBtn  = document.getElementById('prev');
    const nextBtn  = document.getElementById('next');
    const dotsEl   = document.getElementById('dots');

    let idx = 0;

    function parseHash() {
        const m = (location.hash || '').match(/^#(\d+)/);
        if (m) {
            const n = parseInt(m[1], 10) - 1;
            if (n >= 0 && n < SLIDES.length) return n;
        }
        return 0;
    }

    function writeHash(n) {
        const h = '#' + (n + 1);
        if (location.hash !== h) history.replaceState(null, '', h);
    }

    function render() {
        const s = SLIDES[idx];

        // Reset animation
        slideEl.style.animation = 'none';
        // force reflow
        void slideEl.offsetWidth;
        slideEl.style.animation = '';

        // Figure: either hand-drawn image, or synthetic consumers grid
        if (s.figureType === 'consumers') {
            figEl.setAttribute('data-type', 'consumers');
            figEl.innerHTML =
                '<div class="consumers-title">Skipi Intelligence</div>' +
                '<div class="consumers-source">One data layer from the crew <span>→ many decision-makers</span></div>' +
                '<div class="consumers-grid">' +
                s.consumers.map(c =>
                    '<div class="consumer-card">' +
                        '<div class="ico">' + c.ico + '</div>' +
                        '<h4>' + c.name + '</h4>' +
                        '<p>' + c.desc + '</p>' +
                    '</div>'
                ).join('') +
                '</div>';
        } else {
            figEl.removeAttribute('data-type');
            figEl.innerHTML = '<img id="slide-img" src="/presentation/img/slide-' + (idx + 1) + '.jpg" alt="' + s.title.replace(/"/g, '&quot;') + '" loading="eager">';
        }

        kickerEl.textContent = s.kicker;
        titleEl.textContent = s.title;
        leadEl.textContent = s.lead;
        pointsEl.innerHTML = (s.points || []).map(p => '<li>' + p + '</li>').join('');
        pointsEl.style.display = (s.points && s.points.length) ? '' : 'none';
        footEl.innerHTML = '<strong>Captain&rsquo;s note:</strong> ' + s.foot;
        nowEl.textContent = idx + 1;

        prevBtn.disabled = idx === 0;

        // On the last slide, the "next" button turns into a download CTA.
        if (idx === SLIDES.length - 1) {
            nextBtn.disabled = false;
            nextBtn.dataset.mode = 'download';
            nextBtn.innerHTML = '<span class="label">Download Skipi</span> →';
            nextBtn.setAttribute('aria-label', 'Download Skipi');
        } else {
            nextBtn.disabled = false;
            nextBtn.dataset.mode = 'next';
            nextBtn.innerHTML = '<span class="label">Next</span> →';
            nextBtn.setAttribute('aria-label', 'Next slide');
        }

        document.querySelectorAll('.dot').forEach((d, i) => {
            d.classList.toggle('active', i === idx);
            d.setAttribute('aria-selected', i === idx ? 'true' : 'false');
        });
    }

    function go(n) {
        if (n < 0) n = 0;
        if (n >= SLIDES.length) n = SLIDES.length - 1;
        if (n === idx) return;
        idx = n;
        writeHash(idx);
        render();
    }

    // Init dots
    totalEl.textContent = SLIDES.length;
    SLIDES.forEach((_, i) => {
        const d = document.createElement('button');
        d.className = 'dot';
        d.type = 'button';
        d.setAttribute('role', 'tab');
        d.setAttribute('aria-label', 'Slide ' + (i + 1));
        d.addEventListener('click', () => go(i));
        dotsEl.appendChild(d);
    });

    prevBtn.addEventListener('click', () => go(idx - 1));
    nextBtn.addEventListener('click', () => {
        if (nextBtn.dataset.mode === 'download') {
            window.location.href = '/downloads';
        } else {
            go(idx + 1);
        }
    });

    // Keyboard
    document.addEventListener('keydown', e => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
            e.preventDefault(); go(idx + 1);
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
            e.preventDefault(); go(idx - 1);
        } else if (e.key === 'Home') {
            e.preventDefault(); go(0);
        } else if (e.key === 'End') {
            e.preventDefault(); go(SLIDES.length - 1);
        }
    });

    // Hash routing
    window.addEventListener('hashchange', () => {
        idx = parseHash();
        render();
    });

    // Swipe (mobile)
    let touchX = null;
    document.addEventListener('touchstart', e => {
        if (e.touches.length === 1) touchX = e.touches[0].clientX;
    }, { passive: true });
    document.addEventListener('touchend', e => {
        if (touchX === null) return;
        const dx = (e.changedTouches[0].clientX) - touchX;
        if (Math.abs(dx) > 60) {
            if (dx < 0) go(idx + 1);
            else go(idx - 1);
        }
        touchX = null;
    }, { passive: true });

    // Initial render
    idx = parseHash();
    render();
})();
</script>

</body>
</html>
